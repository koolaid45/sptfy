<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Space+Grotesk:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #15120F;
    --panel: #1D1914;
    --amber: #FFB238;
    --amber-glow: rgba(255,178,56,0.55);
    --amber-dim: rgba(255,178,56,0.32);
    --ink: #F4EFE6;
    --ink-dim: #948C7E;
    --hairline: rgba(255,178,56,0.18);
  }

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--void);
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
  }

  #backdrop {
    position: fixed; top: -10%; left: -10%; width: 120%; height: 120%;
    background-size: cover; background-position: center;
    -webkit-filter: blur(60px);
    filter: blur(60px);
    opacity: 0.32;
    -webkit-transition: opacity 0.8s ease;
    transition: opacity 0.8s ease;
  }

  #vignette {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at center, rgba(21,18,15,0) 40%, rgba(21,18,15,0.85) 100%),
      linear-gradient(180deg, rgba(21,18,15,0.2) 0%, rgba(21,18,15,0.6) 100%);
    pointer-events: none;
  }

  #stage {
    position: relative;
    height: 100%;
    display: flex;
    align-items: stretch;
    box-sizing: border-box;
    padding: 5vh 5vw;
  }

  #playerCard {
    width: 38%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding-right: 4vw;
    box-sizing: border-box;
  }

  #artFrame {
    width: 100%;
    max-width: 340px;
    padding: 10px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    box-sizing: border-box;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 20px 40px rgba(0,0,0,0.45);
  }
  #art {
    display: block;
    width: 100%;
    border-radius: 2px;
  }

  #eyebrow {
    margin-top: 22px;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.28em;
    color: var(--amber);
    text-transform: uppercase;
  }

  #title {
    margin-top: 8px;
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 800;
    font-size: clamp(24px, 3.2vw, 40px);
    line-height: 1.02;
    text-transform: uppercase;
    letter-spacing: 0.01em;
  }

  #artist {
    margin-top: 6px;
    font-size: 16px;
    color: var(--ink-dim);
  }

  #transport {
    margin-top: 22px;
    display: flex;
    align-items: center;
    width: 100%;
    max-width: 340px;
  }
  #elapsed, #total {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--amber);
    min-width: 34px;
  }
  #total { text-align: right; color: var(--ink-dim); }
  #progressTrack {
    flex: 1;
    height: 3px;
    margin: 0 10px;
    background: var(--hairline);
    border-radius: 2px;
    overflow: hidden;
  }
  #progressFill {
    height: 100%;
    width: 0%;
    background: var(--amber);
    box-shadow: 0 0 8px var(--amber-glow);
    -webkit-transition: width 0.4s linear;
    transition: width 0.4s linear;
  }

  #eq {
    margin-top: 18px;
    display: flex;
    align-items: flex-end;
    height: 16px;
    gap: 3px;
  }
  #eq span {
    display: block;
    width: 3px;
    height: 30%;
    background: var(--amber);
    border-radius: 1px;
    -webkit-animation: eqPulse 900ms ease-in-out infinite;
    animation: eqPulse 900ms ease-in-out infinite;
    -webkit-animation-play-state: paused;
    animation-play-state: paused;
    opacity: 0.85;
  }
  #eq span:nth-child(1) { -webkit-animation-delay: 0ms; animation-delay: 0ms; }
  #eq span:nth-child(2) { -webkit-animation-delay: 120ms; animation-delay: 120ms; }
  #eq span:nth-child(3) { -webkit-animation-delay: 240ms; animation-delay: 240ms; }
  #eq span:nth-child(4) { -webkit-animation-delay: 80ms; animation-delay: 80ms; }
  #eq span:nth-child(5) { -webkit-animation-delay: 200ms; animation-delay: 200ms; }
  #eq.playing span { -webkit-animation-play-state: running; animation-play-state: running; }
  @-webkit-keyframes eqPulse {
    0%, 100% { height: 20%; }
    50% { height: 100%; }
  }
  @keyframes eqPulse {
    0%, 100% { height: 20%; }
    50% { height: 100%; }
  }

  #lyricsPane {
    width: 62%;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    border-left: 1px solid var(--hairline);
    padding-left: 4vw;
    box-sizing: border-box;
  }
  #lyricsInner {
    position: relative;
    width: 100%;
    -webkit-transition: -webkit-transform 0.5s ease;
    transition: transform 0.5s ease;
  }
  .line {
    font-size: 21px;
    line-height: 1.7;
    padding: 5px 0;
    color: var(--amber-dim);
    -webkit-transition: color 0.4s ease, font-size 0.4s ease;
    transition: color 0.4s ease, font-size 0.4s ease;
  }
  .line.active {
    color: var(--ink);
    font-weight: 500;
    font-size: 25px;
    text-shadow: 0 0 16px var(--amber-glow);
  }

  #idle {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #idle .idleLabel {
    font-family: 'Space Mono', monospace;
    letter-spacing: 0.3em;
    font-size: 12px;
    color: var(--amber);
    text-transform: uppercase;
  }
  #idle .idleSub {
    margin-top: 10px;
    color: var(--ink-dim);
    font-size: 14px;
  }

  @media (max-width: 760px) {
    #stage { flex-direction: column; padding: 4vh 6vw; }
    #playerCard, #lyricsPane { width: 100%; }
    #playerCard { padding-right: 0; align-items: center; text-align: center; }
    #transport, #eq { justify-content: center; }
    #lyricsPane { border-left: none; border-top: 1px solid var(--hairline); padding-left: 0; padding-top: 4vh; margin-top: 3vh; }
  }

  @media (prefers-reduced-motion: reduce) {
    #eq span { -webkit-animation: none; animation: none; }
  }
</style>
</head>
<body>

<div id="backdrop"></div>
<div id="vignette"></div>

<div id="stage" style="display:none;">
  <div id="playerCard">
    <div id="artFrame"><img id="art" src="" alt=""></div>
    <div id="eyebrow">Now Playing</div>
    <div id="title"></div>
    <div id="artist"></div>
    <div id="transport">
      <span id="elapsed">0:00</span>
      <div id="progressTrack"><div id="progressFill"></div></div>
      <span id="total">0:00</span>
    </div>
    <div id="eq"><span></span><span></span><span></span><span></span><span></span></div>
  </div>
  <div id="lyricsPane">
    <div id="lyricsInner"></div>
  </div>
</div>

<div id="idle">
  <div class="idleLabel">Standby</div>
  <div class="idleSub">Nothing playing right now</div>
</div>

<script>
(function () {
  var POLL_MS = 4000;
  var lastTrackKey = null;
  var syncedLines = [];
  var baseProgressMs = 0;
  var baseServerTime = 0;
  var durationMs = 0;
  var isPlaying = false;

  function xhrGet(url, cb) {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          try { cb(null, JSON.parse(xhr.responseText)); }
          catch (e) { cb(e); }
        } else {
          cb(new Error('HTTP ' + xhr.status));
        }
      }
    };
    xhr.send();
  }

  function parseLRC(lrc) {
    var lines = lrc.split('\n');
    var out = [];
    var re = /\[(\d{2}):(\d{2}(?:\.\d+)?)\]/;
    for (var i = 0; i < lines.length; i++) {
      var m = re.exec(lines[i]);
      if (m) {
        var min = parseInt(m[1], 10);
        var sec = parseFloat(m[2]);
        var timeMs = (min * 60 + sec) * 1000;
        var text = lines[i].replace(re, '').replace(/^\s+/, '');
        out.push({ time: timeMs, text: text });
      }
    }
    return out;
  }

  function formatTime(ms) {
    if (ms < 0) ms = 0;
    var totalSec = Math.floor(ms / 1000);
    var m = Math.floor(totalSec / 60);
    var s = totalSec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function renderLyricsShell() {
    var inner = document.getElementById('lyricsInner');
    inner.innerHTML = '';
    for (var i = 0; i < syncedLines.length; i++) {
      var div = document.createElement('div');
      div.className = 'line';
      div.id = 'line-' + i;
      div.appendChild(document.createTextNode(syncedLines[i].text));
      inner.appendChild(div);
    }
  }

  function currentEstimatedProgress() {
    if (!isPlaying) return baseProgressMs;
    var elapsed = Date.now() - baseServerTime;
    return baseProgressMs + elapsed;
  }

  function updateHighlight() {
    var pos = currentEstimatedProgress();

    if (durationMs > 0) {
      var pct = Math.max(0, Math.min(100, (pos / durationMs) * 100));
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('elapsed').textContent = formatTime(pos);
      document.getElementById('total').textContent = formatTime(durationMs);
    }

    if (!syncedLines.length) return;
    var activeIdx = -1;
    for (var i = 0; i < syncedLines.length; i++) {
      if (syncedLines[i].time <= pos) activeIdx = i;
      else break;
    }
    for (var j = 0; j < syncedLines.length; j++) {
      var el = document.getElementById('line-' + j);
      if (!el) continue;
      el.className = (j === activeIdx) ? 'line active' : 'line';
    }
    if (activeIdx >= 0) {
      var activeEl = document.getElementById('line-' + activeIdx);
      var container = document.getElementById('lyricsPane');
      var inner = document.getElementById('lyricsInner');
      if (activeEl && container && inner) {
        var offset = activeEl.offsetTop - (container.clientHeight / 2) + (activeEl.clientHeight / 2);
        inner.style.webkitTransform = 'translateY(' + (-offset) + 'px)';
        inner.style.transform = 'translateY(' + (-offset) + 'px)';
      }
    }
  }

  function poll() {
    xhrGet('/api/now-playing', function (err, data) {
      if (err || !data || !data.playing) {
        document.getElementById('stage').style.display = 'none';
        document.getElementById('idle').style.display = 'flex';
        lastTrackKey = null;
        return;
      }
      document.getElementById('stage').style.display = 'flex';
      document.getElementById('idle').style.display = 'none';

      var key = data.artist + '::' + data.title;
      isPlaying = data.isPlaying;
      baseProgressMs = data.progressMs;
      baseServerTime = Date.now();
      durationMs = data.durationMs || 0;

      var eqEl = document.getElementById('eq');
      eqEl.className = isPlaying ? 'playing' : '';

      if (key !== lastTrackKey) {
        lastTrackKey = key;
        document.getElementById('title').innerHTML = '';
        document.getElementById('title').appendChild(document.createTextNode(data.title));
        document.getElementById('artist').innerHTML = '';
        document.getElementById('artist').appendChild(document.createTextNode(data.artist));
        document.getElementById('art').src = data.albumArt || '';

        var backdropEl = document.getElementById('backdrop');
        backdropEl.style.backgroundImage = data.albumArt ? 'url(' + data.albumArt + ')' : 'none';

        if (data.lyrics && data.lyrics.synced) {
          syncedLines = parseLRC(data.lyrics.synced);
        } else if (data.lyrics && data.lyrics.plain) {
          syncedLines = [{ time: 0, text: data.lyrics.plain }];
        } else {
          syncedLines = [{ time: 0, text: '(no lyrics found)' }];
        }
        renderLyricsShell();
      }
    });
  }

  setInterval(poll, POLL_MS);
  setInterval(updateHighlight, 500);
  poll();
})();
</script>
</body>
</html>
