<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /*
    COMPATIBILITY NOTES (Android 4.4 WebView, Chromium ~30):
    - No CSS custom properties (var()). Per-track theming is injected as a
      plain-hex stylesheet at runtime - see applyTheme().
    - No CSS Grid. Layout is flexbox with -webkit-box fallbacks.
    - No `gap` property (Chrome 84+). Spacing uses margins.
    - Avoid percentage heights on flex children: with an implicitly sized
      flex parent they can resolve to zero on this engine.
  */

  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #14110E;
    color: #F2EDE4;
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
  }

  /* Full-bleed album art wash - the page's main source of colour */
  #backdrop {
    position: fixed; top: -12%; left: -12%; width: 124%; height: 124%;
    background-size: cover; background-position: center;
    -webkit-filter: blur(70px) saturate(1.5);
    filter: blur(70px) saturate(1.5);
    opacity: 0.42;
  }
  #scrim {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, rgba(20,17,14,0.55) 0%, rgba(20,17,14,0.30) 38%, rgba(20,17,14,0.80) 100%);
    pointer-events: none;
  }
  #grain {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    opacity: 0.05;
    pointer-events: none;
    background-image: -webkit-repeating-linear-gradient(0deg, rgba(255,255,255,0.7) 0px, rgba(255,255,255,0.7) 1px, transparent 1px, transparent 3px);
    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.7) 0px, rgba(255,255,255,0.7) 1px, transparent 1px, transparent 3px);
  }

  #stage {
    position: relative;
    height: 100%;
    box-sizing: border-box;
    padding: 4.5vh 7vw 0;
    display: -webkit-box;
    display: flex;
    -webkit-box-orient: vertical;
    flex-direction: column;
  }

  .kicker {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #E8A33D;
    opacity: 0.95;
  }

  /* ---------- SECTION 1 : artwork + identity ---------- */
  #sectionArt {
    -webkit-box-flex: 0;
    flex: none;
    display: -webkit-box;
    display: flex;
    -webkit-box-orient: vertical;
    flex-direction: column;
    -webkit-box-align: center;
    align-items: center;
    text-align: center;
  }

  #artStack {
    position: relative;
    width: 56vw;
    max-width: 300px;
    margin-top: 2.4vh;
  }
  #artRatio { width: 100%; padding-bottom: 100%; }

  #record {
    position: absolute;
    top: 7%;
    left: 20%;
    width: 86%;
    padding-bottom: 86%;
    height: 0;
    border-radius: 50%;
    background:
      -webkit-repeating-radial-gradient(circle at center, #0B0B0B 0, #0B0B0B 2px, #191919 2px, #191919 4px);
    background:
      repeating-radial-gradient(circle at center, #0B0B0B 0, #0B0B0B 2px, #191919 2px, #191919 4px);
    box-shadow: 0 14px 30px rgba(0,0,0,0.6);
    -webkit-animation: spin 3.2s linear infinite;
    animation: spin 3.2s linear infinite;
    -webkit-animation-play-state: paused;
    animation-play-state: paused;
  }
  #record.spinning {
    -webkit-animation-play-state: running;
    animation-play-state: running;
  }
  #recordLabel {
    position: absolute;
    top: 50%; left: 50%;
    width: 26%; padding-bottom: 26%; height: 0;
    -webkit-transform: translate(-50%, -50%);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: #E8A33D;
    box-shadow: inset 0 0 0 3px rgba(0,0,0,0.35);
  }
  @-webkit-keyframes spin { from { -webkit-transform: rotate(0deg); } to { -webkit-transform: rotate(360deg); } }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  #artFrame {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    box-sizing: border-box;
    box-shadow: 0 22px 44px rgba(0,0,0,0.55);
  }
  #art {
    display: block;
    width: 100%;
    border-radius: 1px;
  }

  #title {
    margin-top: 2.6vh;
    font-family: 'Instrument Serif', Georgia, serif;
    font-weight: 400;
    font-size: 30px;
    line-height: 1.08;
    letter-spacing: 0.005em;
  }
  #artist {
    margin-top: 0.7vh;
    font-family: 'Space Mono', monospace;
    font-size: 11.5px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(242,237,228,0.62);
  }

  #transport {
    margin-top: 2.2vh;
    width: 100%;
    display: -webkit-box;
    display: flex;
    -webkit-box-align: center;
    align-items: center;
  }
  #elapsed, #total {
    font-family: 'Space Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    min-width: 34px;
  }
  #elapsed { color: #E8A33D; }
  #total { text-align: right; color: rgba(242,237,228,0.45); }
  #progressTrack {
    -webkit-box-flex: 1;
    flex: 1;
    height: 1px;
    margin: 0 12px;
    background: rgba(242,237,228,0.16);
    position: relative;
  }
  #progressFill {
    position: absolute;
    top: -1px; left: 0;
    height: 3px;
    width: 0%;
    background: #E8A33D;
    -webkit-transition: width 0.5s linear;
    transition: width 0.5s linear;
  }

  /* ---------- SECTION 2 : lyrics ---------- */
  #sectionLyrics {
    -webkit-box-flex: 1;
    flex: 1;
    display: -webkit-box;
    display: flex;
    -webkit-box-orient: vertical;
    flex-direction: column;
    -webkit-box-pack: center;
    justify-content: center;
    text-align: center;
    border-top: 1px solid rgba(242,237,228,0.12);
    margin-top: 3.2vh;
    padding: 2.6vh 0;
    overflow: hidden;
  }

  #lyricPrev, #lyricNext {
    font-size: 14px;
    line-height: 1.45;
    color: rgba(242,237,228,0.34);
    max-height: 2.9em;
    overflow: hidden;
  }
  #lyricCurrent {
    font-family: 'Instrument Serif', Georgia, serif;
    font-size: 26px;
    line-height: 1.3;
    color: #FFFFFF;
    margin: 1.5vh 0;
    min-height: 1.3em;
  }

  #lyricPrev, #lyricCurrent, #lyricNext {
    opacity: 1;
    -webkit-transform: translateY(0);
    transform: translateY(0);
    -webkit-transition: opacity 0.28s ease, -webkit-transform 0.28s ease;
    transition: opacity 0.28s ease, transform 0.28s ease;
  }
  #lyricBlock.swapping #lyricPrev,
  #lyricBlock.swapping #lyricCurrent,
  #lyricBlock.swapping #lyricNext {
    opacity: 0;
    -webkit-transform: translateY(-10px);
    transform: translateY(-10px);
  }
  #lyricBlock.entering #lyricPrev,
  #lyricBlock.entering #lyricCurrent,
  #lyricBlock.entering #lyricNext {
    opacity: 0;
    -webkit-transform: translateY(10px);
    transform: translateY(10px);
    -webkit-transition: none;
    transition: none;
  }

  /* ---------- SECTION 3 : palette strip ---------- */
  #sectionPalette {
    -webkit-box-flex: 0;
    flex: none;
    border-top: 1px solid rgba(242,237,228,0.12);
    padding-top: 1.8vh;
    padding-bottom: 2.4vh;
  }
  #paletteHead {
    display: -webkit-box;
    display: flex;
    -webkit-box-pack: justify;
    justify-content: space-between;
    -webkit-box-align: baseline;
    align-items: baseline;
  }
  #paletteCount {
    font-family: 'Space Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.18em;
    color: rgba(242,237,228,0.4);
    text-transform: uppercase;
  }
  #paletteStrip {
    margin-top: 1.4vh;
    display: -webkit-box;
    display: flex;
    -webkit-box-orient: horizontal;
  }
  .swatch {
    -webkit-box-flex: 1;
    flex: 1;
    margin-right: 6px;
  }
  .swatch:last-child { margin-right: 0; }
  .swatchBlock {
    height: 34px;
    border-radius: 1px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.09);
  }
  .swatchName {
    margin-top: 6px;
    font-size: 9.5px;
    line-height: 1.25;
    color: rgba(242,237,228,0.78);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .swatchHex {
    margin-top: 1px;
    font-family: 'Space Mono', monospace;
    font-size: 8.5px;
    letter-spacing: 0.04em;
    color: rgba(242,237,228,0.38);
    text-transform: uppercase;
  }

  /* ---------- idle ---------- */
  #idle {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: #14110E;
    display: -webkit-box;
    display: flex;
    -webkit-box-orient: vertical;
    flex-direction: column;
    -webkit-box-align: center;
    align-items: center;
    -webkit-box-pack: center;
    justify-content: center;
  }
  #idleTitle {
    font-family: 'Instrument Serif', Georgia, serif;
    font-style: italic;
    font-size: 30px;
    color: rgba(242,237,228,0.85);
  }
  #idleSub {
    margin-top: 10px;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #E8A33D;
  }

  /* Landscape: art and identity side by side, lyrics below */
  @media (orientation: landscape) and (min-aspect-ratio: 5/4) {
    #stage { padding: 4vh 5vw 0; }
    #artStack { width: 26vw; max-width: 210px; }
    #title { font-size: 26px; }
    #lyricCurrent { font-size: 24px; }
    .swatchBlock { height: 26px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #record { -webkit-animation: none; animation: none; }
  }
</style>
<style id="themeOverride"></style>
</head>
<body>

<div id="backdrop"></div>
<div id="scrim"></div>
<div id="grain"></div>

<div id="stage" style="display:none;">

  <div id="sectionArt">
    <div class="kicker">Now Playing</div>
    <div id="artStack">
      <div id="artRatio"></div>
      <div id="record"><div id="recordLabel"></div></div>
      <div id="artFrame"><img id="art" src="" alt=""></div>
    </div>
    <div id="title"></div>
    <div id="artist"></div>
    <div id="transport">
      <span id="elapsed">0:00</span>
      <div id="progressTrack"><div id="progressFill"></div></div>
      <span id="total">0:00</span>
    </div>
  </div>

  <div id="sectionLyrics">
    <div id="lyricBlock">
      <div id="lyricPrev"></div>
      <div id="lyricCurrent"></div>
      <div id="lyricNext"></div>
    </div>
  </div>

  <div id="sectionPalette">
    <div id="paletteHead">
      <span class="kicker">Palette</span>
      <span id="paletteCount"></span>
    </div>
    <div id="paletteStrip"></div>
  </div>

</div>

<div id="idle">
  <div id="idleTitle">Silence</div>
  <div id="idleSub">Standby</div>
</div>

<script>
(function () {
  // Poll interval. The server caches Spotify responses independently, so
  // this only controls how often the display refreshes from the server -
  // it does NOT drive Spotify request volume.
  var POLL_MS = 5000;
  // How many consecutive bad polls before showing Standby. Generous for
  // errors (a rate-limit backoff can last minutes and playback continues
  // fine throughout), strict for a confirmed stop.
  var TRANSIENT_TOLERANCE = 12;  // ~60s of failures
  var STOPPED_TOLERANCE = 2;     // ~10s of confirmed silence
  var consecutiveMisses = 0;
  var lastTrackKey = null;
  var syncedLines = [];
  var baseProgressMs = 0;
  var baseServerTime = 0;
  var durationMs = 0;
  var isPlaying = false;
  var lastActiveIdx = -1;
  var lyricSwapTimer = null;
  var lyricEnterTimer = null;

  function xhrGet(url, cb) {
    var xhr = new XMLHttpRequest();
    var requestStart = Date.now();
    xhr.open('GET', url, true);
    xhr.onreadystatechange = function () {
      if (xhr.readyState === 4) {
        var roundTripMs = Date.now() - requestStart;
        if (xhr.status === 200) {
          try { cb(null, JSON.parse(xhr.responseText), roundTripMs); }
          catch (e) { cb(e); }
        } else {
          cb(new Error('HTTP ' + xhr.status));
        }
      }
    };
    xhr.send();
  }

  function parseLRC(lrc) {
    var lines = lrc.split('\n');
    var out = [];
    var re = /\[(\d{2}):(\d{2}(?:\.\d+)?)\]/;
    for (var i = 0; i < lines.length; i++) {
      var m = re.exec(lines[i]);
      if (m) {
        var min = parseInt(m[1], 10);
        var sec = parseFloat(m[2]);
        var timeMs = (min * 60 + sec) * 1000;
        var text = lines[i].replace(re, '').replace(/^\s+/, '');
        out.push({ time: timeMs, text: text });
      }
    }
    return out;
  }

  function formatTime(ms) {
    if (ms < 0) ms = 0;
    var totalSec = Math.floor(ms / 1000);
    var m = Math.floor(totalSec / 60);
    var s = totalSec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function setText(el, text) {
    el.innerHTML = '';
    el.appendChild(document.createTextNode(text || ''));
  }

  function hexToRgb(hex) {
    var clean = hex.replace('#', '');
    return {
      r: parseInt(clean.substring(0, 2), 16),
      g: parseInt(clean.substring(2, 4), 16),
      b: parseInt(clean.substring(4, 6), 16)
    };
  }
  function hexToRgba(hex, alpha) {
    var c = hexToRgb(hex);
    return 'rgba(' + c.r + ',' + c.g + ',' + c.b + ',' + alpha + ')';
  }

  // Injects a plain-hex stylesheet (no var()) so the page recolours per
  // track without CSS custom properties, unsupported on this WebView.
  function applyTheme(theme) {
    var styleEl = document.getElementById('themeOverride');
    if (!theme) { styleEl.textContent = ''; return; }
    var accent = theme.accent;
    var css =
      'html, body { background: ' + theme.void + '; }' +
      '#idle { background: ' + theme.void + '; }' +
      '#scrim { background: linear-gradient(180deg, ' + hexToRgba(theme.void, 0.55) + ' 0%, ' +
        hexToRgba(theme.void, 0.28) + ' 38%, ' + hexToRgba(theme.void, 0.82) + ' 100%); }' +
      '.kicker, #elapsed, #idleSub { color: ' + accent + '; }' +
      '#progressFill { background: ' + accent + '; }' +
      '#recordLabel { background: ' + accent + '; }' +
      '#sectionLyrics, #sectionPalette { border-top-color: ' + hexToRgba(accent, 0.22) + '; }' +
      '#lyricPrev, #lyricNext { color: ' + hexToRgba(accent, 0.42) + '; }';
    styleEl.textContent = css;
  }

  function renderPalette(swatches) {
    var strip = document.getElementById('paletteStrip');
    var count = document.getElementById('paletteCount');
    strip.innerHTML = '';
    if (!swatches || !swatches.length) {
      setText(count, 'unavailable');
      return;
    }
    setText(count, swatches.length + ' tones');
    for (var i = 0; i < swatches.length; i++) {
      var sw = swatches[i];
      var cell = document.createElement('div');
      cell.className = 'swatch';

      var block = document.createElement('div');
      block.className = 'swatchBlock';
      block.style.backgroundColor = sw.hex;

      var name = document.createElement('div');
      name.className = 'swatchName';
      name.appendChild(document.createTextNode(sw.name));

      var hex = document.createElement('div');
      hex.className = 'swatchHex';
      hex.appendChild(document.createTextNode(sw.hex));

      cell.appendChild(block);
      cell.appendChild(name);
      cell.appendChild(hex);
      strip.appendChild(cell);
    }
  }

  function lineTextAt(idx) {
    if (idx < 0 || idx >= syncedLines.length) return '';
    return syncedLines[idx].text;
  }

  function writeLyricTriplet(activeIdx) {
    var prevEl = document.getElementById('lyricPrev');
    var currEl = document.getElementById('lyricCurrent');
    var nextEl = document.getElementById('lyricNext');

    if (activeIdx < 0) {
      // Intro: nothing sung yet, so nothing is highlighted. The opening
      // line waits dimmed in the "next" slot.
      setText(prevEl, '');
      setText(currEl, '');
      setText(nextEl, lineTextAt(0));
      return;
    }
    setText(prevEl, lineTextAt(activeIdx - 1));
    setText(currEl, lineTextAt(activeIdx));
    setText(nextEl, lineTextAt(activeIdx + 1));
  }

  function showLyricLines(activeIdx, animate) {
    var block = document.getElementById('lyricBlock');

    if (!animate) {
      block.className = '';
      writeLyricTriplet(activeIdx);
      return;
    }

    // Fade out, swap while invisible, fade back in from below. Timeouts
    // rather than transitionend, which fires unreliably here when several
    // elements transition together.
    if (lyricSwapTimer) { clearTimeout(lyricSwapTimer); }
    if (lyricEnterTimer) { clearTimeout(lyricEnterTimer); }

    block.className = 'swapping';
    lyricSwapTimer = setTimeout(function () {
      writeLyricTriplet(activeIdx);
      block.className = 'entering';
      lyricEnterTimer = setTimeout(function () {
        block.className = '';
      }, 20);
    }, 280);
  }

  function currentEstimatedProgress() {
    if (!isPlaying) return baseProgressMs;
    var pos = baseProgressMs + (Date.now() - baseServerTime);
    // Don't let the local clock run past the track while we're holding a
    // stale state through a connection blip.
    if (durationMs > 0 && pos > durationMs) pos = durationMs;
    return pos;
  }

  function tick() {
    var pos = currentEstimatedProgress();

    if (durationMs > 0) {
      var pct = Math.max(0, Math.min(100, (pos / durationMs) * 100));
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('elapsed').textContent = formatTime(pos);
      document.getElementById('total').textContent = formatTime(durationMs);
    }

    if (!syncedLines.length) return;
    var activeIdx = -1;
    for (var i = 0; i < syncedLines.length; i++) {
      if (syncedLines[i].time <= pos) activeIdx = i;
      else break;
    }
    if (activeIdx === lastActiveIdx) return;
    lastActiveIdx = activeIdx;
    showLyricLines(activeIdx, true);
  }

  function goStandby() {
    document.getElementById('stage').style.display = 'none';
    document.getElementById('idle').style.display = 'flex';
    lastTrackKey = null;
    isPlaying = false;
  }

  function poll() {
    xhrGet('/api/now-playing', function (err, data, roundTripMs) {
      // A single bad poll is not proof the music stopped. Network blips,
      // the host waking from sleep, token refreshes and Spotify's own 204
      // during track changes all produce momentary empties. Only fall back
      // to Standby after several consecutive misses, so the display keeps
      // showing the current track instead of flickering to "Silence".
      if (err || !data || !data.playing) {
        var reason = (data && data.reason) || 'network';
        var transient = !!err || (reason !== 'nothing_playing');
        consecutiveMisses++;

        var threshold = transient ? TRANSIENT_TOLERANCE : STOPPED_TOLERANCE;
        if (consecutiveMisses >= threshold) {
          goStandby();
        }
        // NOTE: deliberately no fast retry here. An extra retry fires on
        // top of the regular interval, so failures would generate MORE
        // traffic - which is how the Spotify rate limit got tripped. The
        // regular poll interval is the only request cadence.
        return;
      }

      consecutiveMisses = 0;
      document.getElementById('stage').style.display = 'flex';
      document.getElementById('idle').style.display = 'none';

      var key = data.artist + '::' + data.title;
      isPlaying = data.isPlaying;
      var netComp = isPlaying ? Math.round((roundTripMs || 0) / 2) : 0;
      baseProgressMs = data.progressMs + netComp;
      baseServerTime = Date.now();
      durationMs = data.durationMs || 0;

      document.getElementById('record').className = isPlaying ? 'spinning' : '';

      if (key !== lastTrackKey) {
        lastTrackKey = key;
        setText(document.getElementById('title'), data.title);
        setText(document.getElementById('artist'), data.artist);
        document.getElementById('art').src = data.albumArt || '';
        document.getElementById('backdrop').style.backgroundImage =
          data.albumArt ? 'url(' + data.albumArt + ')' : 'none';

        if (data.lyrics && data.lyrics.synced) {
          syncedLines = parseLRC(data.lyrics.synced);
        } else if (data.lyrics && data.lyrics.plain) {
          syncedLines = [{ time: 0, text: data.lyrics.plain }];
        } else {
          syncedLines = [{ time: 0, text: '(no lyrics found)' }];
        }

        if (lyricSwapTimer) { clearTimeout(lyricSwapTimer); lyricSwapTimer = null; }
        if (lyricEnterTimer) { clearTimeout(lyricEnterTimer); lyricEnterTimer = null; }
        lastActiveIdx = -1;
        showLyricLines(-1, false);

        if (data.palette) {
          renderPalette(data.palette.swatches);
          applyTheme(data.palette.theme);
        } else {
          renderPalette(null);
          applyTheme(null);
        }
      }
    });
  }

  setInterval(poll, POLL_MS);
  setInterval(tick, 500);
  poll();
})();
</script>
</body>
</html>
